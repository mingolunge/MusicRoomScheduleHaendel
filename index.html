<!DOCTYPE html>
<html>
<head>
<style>
table {
  font-family: NerdMono, sans-serif;
  border-collapse: collapse;
  width: 100%;
}

td, th {
  border: 1px solid #dddddd;
  text-align: center;
  padding: 8px;
}

tr:nth-child(even) {
  background-color: #f2f2f2;
}
</style>
</head>
<body>

<h2>Music Room Schedule</h2>

<table id="schedule">
  <tr>
    <th>Timeslot</th>
    <th>Mon</th>
    <th>Tue</th>
    <th>Wed</th>
    <th>Thu</th>
    <th>Fri</th>
    <th>Sat</th>
    <th>Sun</th>
  </tr>
  <!-- Example row -->
  <tr>
    <td>8:00</td>
    <td contenteditable="true"></td>
    <td contenteditable="true"></td>
    <td contenteditable="true"></td>
    <td contenteditable="true"></td>
    <td contenteditable="true"></td>
    <td contenteditable="true"></td>
    <td contenteditable="true"></td>
  </tr>
  <tr>
    <td>9:00</td>
    <td contenteditable="true"></td>
    <td contenteditable="true"></td>
    <td contenteditable="true"></td>
    <td contenteditable="true"></td>
    <td contenteditable="true"></td>
    <td contenteditable="true"></td>
    <td contenteditable="true"></td>
  </tr>
  <!-- Add the rest of your rows here -->
</table>

<script>
// Load saved content from localStorage
document.addEventListener('DOMContentLoaded', () => {
  const table = document.getElementById('schedule');
  const cells = table.querySelectorAll('td[contenteditable="true"]');

  cells.forEach((cell, index) => {
    const saved = localStorage.getItem('cell_' + index);
    if (saved) cell.innerText = saved;

    // Save changes to localStorage on input
    cell.addEventListener('input', () => {
      localStorage.setItem('cell_' + index, cell.innerText);
    });
  });
});
</script>

</body>
</html>
