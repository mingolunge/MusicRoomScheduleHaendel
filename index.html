<!DOCTYPE html>
<html>
<head>
<style>
table {
  font-family: NerdMono, sans-serif;
  border-collapse: collapse;
  width: 100%;
}
td, th {
  border: 1px solid #dddddd;
  text-align: center;
  padding: 8px;
}
tr:nth-child(even) {
  background-color: #f2f2f2;
}
</style>
</head>
<body>

<h2>Music Room Schedule</h2>

<table id="schedule">
  <tr>
    <th>Timeslot</th>
    <th>Mon</th>
    <th>Tue</th>
    <th>Wed</th>
    <th>Thu</th>
    <th>Fri</th>
    <th>Sat</th>
    <th>Sun</th>
  </tr>
  <!-- Rows will be inserted dynamically -->
</table>

<script>
// Default schedule
const times = ['8:00','9:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00','20:00'];
const days = 7;
const table = document.getElementById('schedule');

let schedule = [];

// Load schedule from server
async function loadSchedule() {
  const res = await fetch('/api/schedule');
  schedule = await res.json();

  // If empty, create default
  if(schedule.length === 0) {
    schedule = times.map(time => Array(days).fill(''));
  }

  renderTable();
}

// Render table
function renderTable() {
  // Remove old rows
  table.querySelectorAll('tr:not(:first-child)').forEach(r => r.remove());

  schedule.forEach((row, rowIndex) => {
    const tr = document.createElement('tr');
    const timeCell = document.createElement('td');
    timeCell.innerText = times[rowIndex];
    tr.appendChild(timeCell);

    row.forEach((cell, colIndex) => {
      const td = document.createElement('td');
      td.contentEditable = "true";
      td.innerText = cell;
      td.addEventListener('input', () => {
        schedule[rowIndex][colIndex] = td.innerText;
        saveSchedule();
      });
      tr.appendChild(td);
    });

    table.appendChild(tr);
  });
}

// Save schedule to server
async function saveSchedule() {
  await fetch('/api/schedule', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(schedule)
  });
}

loadSchedule();
</script>

</body>
</html>
