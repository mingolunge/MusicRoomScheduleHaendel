<!DOCTYPE html>
<html>
<head>
<style>
table { border-collapse: collapse; width: 100%; font-family: NerdMono, sans-serif; }
td, th { border: 1px solid #dddddd; text-align: center; padding: 8px; }
tr:nth-child(even) { background-color: #f2f2f2; }
td[contenteditable="true"] { background-color: #ffffe0; }
</style>
</head>
<body>

<h2>Music Room Schedule</h2>

<table id="schedule">
  <tr id="header-row"></tr>
  <!-- Data rows will be inserted dynamically -->
</table>

<!-- Include PapaParse -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTjtwpRvMpT2lzyEwaO88cN317BgNH1C90SL_HMcGqT2gXbbNl3xwpK-9cS_iuY72m1hxvz28k3riLr/pub?output=csv';
const table = document.getElementById('schedule');

async function loadSchedule() {
    const res = await fetch(CSV_URL);
    const csvText = await res.text();
    const data = Papa.parse(csvText).data;

    // Render header
    table.innerHTML = '';
    const headerRow = document.createElement('tr');
    data[0].forEach(h => {
        const th = document.createElement('th');
        th.innerText = h;
        headerRow.appendChild(th);
    });
    table.appendChild(headerRow);

    // Render data rows
    data.slice(1).forEach((row, rowIndex) => {
        const tr = document.createElement('tr');
        row.forEach((cell, colIndex) => {
            const td = document.createElement('td');
            td.contentEditable = colIndex === 0 ? false : true; // Make timeslot not editable
            td.innerText = cell;
            td.addEventListener('input', () => {
                // Optional: save edits locally (cannot write to Google Sheet directly)
                localStorage.setItem(`cell_${rowIndex}_${colIndex}`, td.innerText);
            });
            // Load saved localStorage edits
            const saved = localStorage.getItem(`cell_${rowIndex}_${colIndex}`);
            if(saved) td.innerText = saved;

            tr.appendChild(td);
        });
        table.appendChild(tr);
    });
}

loadSchedule();
</script>

</body>
</html>
